name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable package manager
        run: |
          npm install -g corepack@0.34.5
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Build and bundle official DeepSeek web client
        run: bash scripts/build-web.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Chat-Demo-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
